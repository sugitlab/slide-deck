<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Decks — sugitlab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grape+Nuts&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;600;700;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --white: #FFFFFF;
      --base: #F5F7F9;
      --subtle: #E9EEF2;
      --muted: #D0D9E0;
      --border: #D0D9E0;
      --text-primary: #0D0D0D;
      --text-secondary: #3E5A6B;
      --text-tertiary: #5A7485;
      --text-disabled: #A8B8C4;
      --sky: #71B1D9;
      --sky-hover: #4E97C5;
      --sky-dark: #3278A4;
      --shadow-sm: 0 2px 6px rgba(13,13,13,0.08), 0 1px 2px rgba(13,13,13,0.04);
      --shadow-md: 0 4px 16px rgba(13,13,13,0.10), 0 2px 4px rgba(13,13,13,0.06);
      --font-display: 'Space Mono', 'Courier New', monospace;
      --font-body: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif;
      --font-accent: 'Grape Nuts', cursive;
      --text-xs: 0.6875rem;
      --text-sm: 0.8125rem;
      --text-base: 0.9375rem;
      --text-md: 1.0625rem;
      --text-lg: 1.25rem;
      --text-xl: 1.5rem;
      --text-2xl: 1.875rem;
      --text-3xl: 2.25rem;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--base);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .page-wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px 0;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 48px;
    }

    .navigation a {
      display: flex;
      align-items: center;
      transition: opacity 200ms cubic-bezier(0, 0, 0.2, 1);
    }

    .navigation a:hover { opacity: 0.7; }

    .navigation svg { display: block; }

    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .header-label {
      font-family: var(--font-display);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--sky);
      margin-bottom: 12px;
    }

    .header-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--text-3xl);
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .header-bar {
      width: 80px;
      height: 3px;
      background: var(--sky);
      margin: 16px auto;
      border-radius: 2px;
    }

    .header-accent {
      font-family: var(--font-accent);
      font-size: var(--text-lg);
      color: var(--sky-dark);
    }

    .slides {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      display: block;
      border-radius: 12px;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 200ms cubic-bezier(0, 0, 0.2, 1);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .card-image {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 24px;
    }

    .card-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--text-md);
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin: 0 0 8px;
      line-height: 1.35;
    }

    .card-date {
      font-size: var(--text-sm);
      color: var(--text-tertiary);
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .card-filename {
      font-family: var(--font-display);
      font-size: var(--text-xs);
      color: var(--text-disabled);
      letter-spacing: 0.04em;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 600ms cubic-bezier(0, 0, 0.2, 1),
                  transform 600ms cubic-bezier(0, 0, 0.2, 1);
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .footer {
      background: var(--white);
      border-top: 1px solid var(--subtle);
      padding: 24px;
      text-align: center;
      font-family: var(--font-display);
      font-size: var(--text-xs);
      color: var(--text-disabled);
      letter-spacing: 0.04em;
      margin-top: 64px;
    }

    @media (max-width: 768px) {
      .page-wrapper { padding: 24px 16px 0; }
      .navigation { margin-bottom: 32px; }
      .header { margin-bottom: 32px; }
      .header-title { font-size: var(--text-2xl); }
      .slides { grid-template-columns: 1fr; gap: 16px; }
      .footer { margin-top: 40px; }
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <div class="navigation">
      <a href="https://github.com/sugitlab" aria-label="GitHub">
        <svg width="36" height="36" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"
            fill="#0D0D0D" />
        </svg>
      </a>
      <a href="https://sugitlab.dev" aria-label="sugitlab.dev">
        <img src="https://avatars.githubusercontent.com/u/26006414?v=4" width="36" height="36"
          alt="sugitlab" style="border-radius: 9999px; border: 2px solid var(--white); box-shadow: var(--shadow-sm);">
      </a>
    </div>
    <div class="header fade-in">
      <div class="header-label">Slide Collection</div>
      <h1 class="header-title">Slide Decks.</h1>
      <div class="header-bar"></div>
      <div class="header-accent">design that breathes.</div>
    </div>
    <div class="slides">
      {{SLIDES_CONTENT}}
    </div>
  </div>
  <footer class="footer">
    &copy; 2026 sugitlab &mdash; Updated at: {{UPDATED_DATE}}
  </footer>

  <script>
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.fade-in').forEach(function(el) { observer.observe(el); });
  </script>
</body>

</html>
